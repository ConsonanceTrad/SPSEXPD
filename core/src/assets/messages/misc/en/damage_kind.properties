actors.damagetype.damagekindtext.desc_pierce=Usually from light melee weapons or fragmentation/AP firearms: low damage, but fully effective against heavily armored foes.
actors.damagetype.damagekindtext.desc_blunt=Usually from impact guns or heavy hammers: slower swing, but fully effective against any physical protection.
actors.damagetype.damagekindtext.desc_slash=Usually from swift single-handed blades or special firearms: heavy damage and bleeding against unarmored foes, weaker against armored ones.
actors.damagetype.damagekindtext.desc_impact=Usually from bombs, fans, instruments and sonic guns: low damage that decays with distance, but bypasses part of armor.
actors.damagetype.damagekindtext.desc_crush=Crushing damage from super-heavy weapons: extremely slow, and ignores most armor protection.
actors.damagetype.damagekindtext.desc_curse=Damage from certain rituals or spells.
actors.damagetype.damagekindtext.desc_energy=Unattributed spell damage.
actors.damagetype.damagekindtext.desc_pure=Strikes health directly, bypassing all defenses.
actors.damagetype.damagekindtext.desc_heal=For the undead, healing power turns into damage instead.
actors.damagetype.damagekindtext.desc_interfere=Data intrusion damage dealt to data-driven and mechanical creatures.
actors.damagetype.damagekindtext.desc_hunger=Life attrition caused by hunger.
actors.damagetype.damagekindtext.desc_disease=Aftermath damage of malignant states such as bleeding.
actors.damagetype.damagekindtext.desc_backlash=Self-harm dealt by failed rituals to their caster.
actors.damagetype.damagekindtext.desc_element=Elemental damage; effects vary by element.
